# Served under /avatar/ because the dashboard's web nginx forwards that prefix
# unchanged. File names carry no hash, so browsers revalidate via ETag.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location /avatar/ {
        add_header Cache-Control "no-cache" always;
    }

    # nginx's mime.types does not know GLB; three.js does not care, browsers' devtools do.
    location ~ \.glb$ {
        types { }
        default_type model/gltf-binary;
        add_header Cache-Control "no-cache" always;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
